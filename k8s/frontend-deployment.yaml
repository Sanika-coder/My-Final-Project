apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: mern-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: my-final-project-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
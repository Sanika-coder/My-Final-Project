services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mern-backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: unless-stopped